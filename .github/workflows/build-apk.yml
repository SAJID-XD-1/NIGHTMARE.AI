name: Build AI Assistant APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK & Prepare AI Assistant
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2. Set up JDK (required for Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Python (for backend AI assistant)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Build Android APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # 6. Test Python backend (optional)
      - name: Test Backend
        run: |
          if [ -f backend/app.py ]; then
            echo "Python backend exists, checking syntax..."
            python -m py_compile backend/app.py
          fi

      # 7. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 8. Upload backend as artifact (optional)
      - name: Upload Backend
        uses: actions/upload-artifact@v3
        with:
          name: backend
          path: backend/

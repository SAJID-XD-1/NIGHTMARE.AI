name: Build Android APK

on: workflow_dispatch:

jobs: build-android: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4

- name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install Expo CLI
    run: npm i -g expo-cli eas-cli

  - name: Install deps
    run: npm install

  - name: Login to EAS
    run: eas whoami || eas login --token "$EXPO_TOKEN"
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  - name: Build APK
    run: eas build --platform android --profile preview --non-interactive
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

